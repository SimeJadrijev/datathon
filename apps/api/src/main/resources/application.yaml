spring:
  application:
    name: api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/datathon}
    username: ${DB_USER:datathon}
    password: ${DB_PASSWORD:datathon}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

seed:
  enabled: ${SEED_ENABLED:true}

ingest:
  on-startup: false
  cache-dir: ${INGEST_CACHE_DIR:data/cache}
  closed-pages: 5

llm:
  api-key: ${ANTHROPIC_API_KEY:}
  base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
  model: ${LLM_MODEL:claude-haiku-5-5}
  budget-usd: ${LLM_BUDGET_USD:2.0}
  max-tokens: ${LLM_MAX_TOKENS:2048}
  connect-timeout-seconds: ${LLM_CONNECT_TIMEOUT_SECONDS:5}
  read-timeout-seconds: ${LLM_READ_TIMEOUT_SECONDS:60}
  max-attempts: ${LLM_MAX_ATTEMPTS:3}
  prices:
    claude-haiku-5-5: { input: 0.10, output: 0.50 }
    claude-sonnet-5-5: { input: 2.00, output: 10.00 }

sudreg:
  base-url: https://sudreg-data.gov.hr
  client-id: ${SUDREG_CLIENT_ID:}
  client-secret: ${SUDREG_CLIENT_SECRET:}

admin:
  key: ${ADMIN_KEY:}
