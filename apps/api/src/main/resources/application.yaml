spring:
  application:
    name: api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/datathon}
    username: ${DB_USER:datathon}
    password: ${DB_PASSWORD:datathon}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

seed:
  enabled: ${SEED_ENABLED:true}

ingest:
  on-startup: false
  cache-dir: ${INGEST_CACHE_DIR:data/cache}
  closed-pages: 5

llm:
  api-key: ${ANTHROPIC_API_KEY:}
  budget-usd: 2.0

sudreg:
  base-url: https://sudreg-data.gov.hr
  client-id: ${SUDREG_CLIENT_ID:}
  client-secret: ${SUDREG_CLIENT_SECRET:}

admin:
  key: ${ADMIN_KEY:}
